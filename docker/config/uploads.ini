; Local dev overrides for WordPress in Docker.
; Keep deprecations in logs, but don't print them in browser output.

upload_max_filesize = 100G
post_max_size = 100G
memory_limit = 2G
max_execution_time = 3600
max_input_time = 3600

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
